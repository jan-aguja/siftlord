# Generated from assets/icon/siftlord_icon_source.png by tool/make_icons.py.
# The foreground is a padded copy so the art survives Android's adaptive mask.
flutter_launcher_icons:
  image_path: "assets/icon/siftlord_icon.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/siftlord_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
